<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>迷路了 · 依林 Yilin</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#07080b" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icon-64.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080b; --bg-deep: #030405;
      --ink: #f4efe4; --ink-2: rgba(244,239,228,.62); --ink-3: rgba(244,239,228,.50);
      --gold: #c8a55f; --gold-soft: rgba(200,165,95,.14); --gold-line: rgba(200,165,95,.30);
      --hair: rgba(244,239,228,.09);
      --ease: cubic-bezier(.19,1,.22,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      min-height: 100svh; display: grid; place-items: center;
      padding: 40px clamp(24px, 6vw, 80px);
      font-family: "Inter", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background: var(--bg); color: var(--ink);
      font-weight: 300; line-height: 1.8; overflow-x: hidden; text-align: center;
    }
    a { color: inherit; text-decoration: none; }

    .atmos { position: fixed; inset: 0; z-index: -3; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 50% -5%, rgba(185,203,214,.06), transparent 55%),
        radial-gradient(ellipse 60% 50% at 82% 20%, rgba(200,165,95,.05), transparent 50%),
        linear-gradient(180deg, var(--bg-deep), #05070c 50%, var(--bg-deep)); }
    .atmos::after { content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse 120% 110% at 50% 45%, transparent 44%, rgba(2,3,6,.85) 100%); }
    .stars { position: fixed; inset: 0; z-index: -2; pointer-events: none; opacity: .2;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.55) .6px, transparent 1px),
        radial-gradient(circle, rgba(185,203,214,.45) .5px, transparent .9px);
      background-size: 250px 250px, 370px 370px; background-position: 20px 30px, 130px 190px; }

    /* 一颗孤独的星球 */
    .orb { position: relative; width: min(58vw, 300px); aspect-ratio: 1; margin: 0 auto 8px; }
    .orb .core { position: absolute; inset: 22%; border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, rgba(255,246,224,.9), rgba(200,165,95,.5) 22%, rgba(120,92,44,.28) 48%, transparent 70%);
      opacity: .55; animation: breathe 15s ease-in-out infinite alternate; }
    .orb i { position: absolute; inset: 4%; border: 1px solid rgba(244,239,228,.11); border-radius: 50%;
      transform: rotate(-22deg) scaleY(.32); animation: spin 70s linear infinite; }
    .orb i.b { inset: -12%; border-color: rgba(200,165,95,.13); transform: rotate(16deg) scaleY(.2);
      animation-duration: 104s; animation-direction: reverse; }
    @keyframes breathe { to { transform: scale(1.06); opacity: .66; } }
    @keyframes spin { to { transform: rotate(338deg) scaleY(.32); } }

    .code { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 300;
      font-size: clamp(64px, 13vw, 132px); line-height: 1; color: var(--gold);
      letter-spacing: .02em; text-shadow: 0 0 60px rgba(200,165,95,.25); }
    h1 { font-family: "Cormorant Garamond", "Songti SC", serif; font-weight: 300;
      font-size: clamp(26px, 4vw, 40px); line-height: 1.3; margin: 18px 0 14px; }
    p { color: var(--ink-2); max-width: 42ch; margin: 0 auto 40px; font-size: 15px; }
    .btn { display: inline-flex; align-items: center; gap: 10px;
      padding: 13px 28px; border-radius: 999px;
      border: 1px solid var(--gold-line); background: var(--gold-soft); color: var(--gold);
      font-size: 13.5px; letter-spacing: .04em;
      transition: transform .4s var(--ease), background .4s ease, box-shadow .4s ease; }
    .btn:hover { transform: translateY(-2px); background: rgba(200,165,95,.2);
      box-shadow: 0 0 40px rgba(200,165,95,.18); }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
    footer { margin-top: 52px; color: rgba(244,239,228,.36); font-size: 12px; letter-spacing: .02em; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <div class="atmos"></div>
  <div class="stars"></div>

  <main>
    <div class="orb"><i class="b"></i><i></i><div class="core"></div></div>
    <div class="code">404</div>
    <h1>这颗星球还没有被造出来</h1>
    <p>你走到了这个宇宙的边缘。也许是链接旧了，也许是我还没把它建好。</p>
    <a class="btn" href="/Yilin-portfolio/">← 回到我的宇宙</a>
    <footer>© 2026 Yilin Gong · El universo de Yilin</footer>
  </main>
</body>
</html>
